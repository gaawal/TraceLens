[project]
name = "tracelens-backend"
version = "0.11.0"
description = "TraceLens remote log backend with environment-scoped Redis fingerprint indexes and content cache"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1.5,<4",
  "Django>=6.0.7,<6.1",
  "djangorestframework>=3.17.1,<3.18",
  "drf-spectacular[sidecar]>=0.28,<1",
  "django-cors-headers>=4.7,<5",
  "python-dotenv>=1.1,<2",
  "cryptography>=45,<48",
  "gunicorn>=23,<28",
  "uvicorn[standard]>=0.30,<1",
  "paramiko>=3.5,<5",
  "redis>=5.2,<7",
  "langgraph>=1.2.11,<2",
  "openai>=1.55.0,<3",
  "httpx>=0.27,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
